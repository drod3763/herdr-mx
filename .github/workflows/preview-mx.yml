name: Preview (mx)

# herdr-mx preview channel: every push to `mx` publishes a fat-bundle
# prerelease tagged mx-preview-<date>-<sha>. Stable releases (v*-mx.N tags,
# which feed the brew `herdr-mx` formula) are cut manually on request.
on:
  workflow_dispatch:
  push:
    branches:
      - mx

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: preview-mx
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.plan.outputs.short_sha }}
      build_id: ${{ steps.plan.outputs.build_id }}
      tag: ${{ steps.plan.outputs.tag }}
      base_version: ${{ steps.plan.outputs.base_version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Plan preview build
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          # Date + HHMM (UTC) make preview versions humanly orderable: `herdr status`
          # surfaces this stamp as `build: YYYY.MM.DD.HHMM` — the SAME number the tap
          # derives from the tag for the brew formula version, so status and brew agree.
          day="$(date -u +%Y-%m-%d)"
          hhmm="$(date -u +%H%M)"
          build_id="$day-$hhmm-$short_sha"
          base_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          {
            echo "short_sha=$short_sha"
            echo "build_id=$build_id"
            echo "tag=mx-preview-$build_id"
            echo "base_version=$base_version"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'
      HERDR_BUILD_CHANNEL: mx
      HERDR_BUILD_ID: preview-${{ needs.preflight.outputs.build_id }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: preview-mx-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Pack fat bundles
        run: |
          set -euo pipefail
          VERSION="${{ needs.preflight.outputs.base_version }}-mx.preview-${{ needs.preflight.outputs.build_id }}"
          COMMIT="${GITHUB_SHA::7}"
          PACKER=herdr-linux-x86_64/herdr-linux-x86_64
          chmod +x "$PACKER"
          declare -A OSARCH=(
            [herdr-macos-aarch64]=macos-aarch64
            [herdr-macos-x86_64]=macos-x86_64
            [herdr-linux-aarch64]=linux-aarch64
            [herdr-linux-x86_64]=linux-x86_64
          )
          mkdir -p fat
          for name in "${!OSARCH[@]}"; do
            args=()
            for other in "${!OSARCH[@]}"; do
              [ "$other" = "$name" ] && continue
              args+=(--binary "${OSARCH[$other]}=$other/$other")
            done
            "$PACKER" bundle pack --carrier "$name/$name" --output "fat/$name" \
              --version "$VERSION" --commit "$COMMIT" "${args[@]}"
            "$PACKER" bundle list "fat/$name"
          done

      # Sign preview assets with the same release key so `herdr update` on the preview channel
      # verifies authenticity before running a downloaded binary. Fails closed if the secret is
      # missing so an unsigned preview never ships.
      - name: Sign fat bundles
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBKEY: RWQupm2xx/vDQ2YjRHgy/84xAkdgzIgwIN/4CyOy5n1rQRQnHW34r3D2
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY secret is not set; refusing to publish an unsigned preview" >&2
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          trap 'rm -f minisign.key' EXIT
          for name in herdr-linux-x86_64 herdr-linux-aarch64 herdr-macos-x86_64 herdr-macos-aarch64; do
            minisign -S -s minisign.key -m "fat/$name"
            minisign -Vm "fat/$name" -P "$MINISIGN_PUBKEY"
          done

      - name: Generate preview notes
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git tag -l 'mx-preview-*' --sort=-creatordate | head -1 || true)"
          {
            echo "herdr-mx preview build \`${{ needs.preflight.outputs.build_id }}\` (commit ${GITHUB_SHA::7})."
            echo
            echo "Fat-bundle binaries; installs as \`herdr\`. Install with:"
            echo
            echo '```'
            echo "brew install 2lab-ai/tap/herdr-mx-preview"
            echo '```'
            echo
            if [ -n "$prev" ]; then
              echo "Changes since \`$prev\`:"
              echo
              git log --oneline "$prev"..HEAD | sed 's/^/- /' | head -40
            fi
          } > PREVIEW_NOTES.md

      - name: Create preview prerelease
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: mx preview ${{ needs.preflight.outputs.build_id }}
          body_path: PREVIEW_NOTES.md
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: |
            fat/herdr-linux-x86_64
            fat/herdr-linux-aarch64
            fat/herdr-macos-x86_64
            fat/herdr-macos-aarch64
            fat/herdr-linux-x86_64.minisig
            fat/herdr-linux-aarch64.minisig
            fat/herdr-macos-x86_64.minisig
            fat/herdr-macos-aarch64.minisig

      - name: Prune old mx previews (keep 3)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("mx-preview-"))) | .tagName' \
            | tail -n +4 \
            | while read -r tag; do
                echo "pruning $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
